[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sacr-tool"
version = "1.0.0"
description = "SACR Tool — Complete Sentiment Analysis Pipeline"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "nltk",
    "scikit-learn",
    "wordcloud",
    "contractions",
    "shap",
    "lime",
    "joblib",
    "scipy",
]

[project.scripts]
sacr_cli = "sacr_cli:main"

[project.optional-dependencies]
streamlit = ["streamlit", "fpdf", "plotly", "pillow"]
full = ["streamlit", "fpdf", "plotly", "pillow", "imbalanced-learn"]

[tool.setuptools]
packages = []
py-modules = ["sacr_cli", "utils", "sentiment_modeltrainer"]